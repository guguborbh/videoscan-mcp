[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videoscan-mcp"
version = "0.1.4"
description = "MCP server for comprehensive video analysis — transcription, AI-powered visual frame analysis, and metadata extraction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Lee"},
]
keywords = ["mcp", "video", "analysis", "transcription", "vision", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "yt-dlp>=2024.0.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.5.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
videoscan = "videoscan.server:main"
videoscan-mcp = "videoscan.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/videoscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
